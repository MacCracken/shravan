[package]
name = "shravan"
version = "2.2.0"
description = "shravan — audio codecs for AGNOS"
license = "GPL-3.0-only"
repository = "https://github.com/MacCracken/shravan"

cyrius = "4.10.3"

[build]
src = "src/main.cyr"
output = "build/shravan"

[deps]
stdlib = ["string", "fmt", "alloc", "vec", "str", "syscalls", "io", "args", "assert", "tagged", "math", "json", "thread", "fnptr"]

[deps.sankoch]
git = "https://github.com/MacCracken/sankoch.git"
tag = "1.0.0"
modules = ["dist/sankoch.cyr"]
