name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CYRIUS_VERSION: "3.3.4"
jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/" 2>/dev/null || true
          cp "$CYRIUS_DIR/scripts/cyrius" "$HOME/.cyrius/bin/cyrius" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/bin/"* 2>/dev/null || true
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "Cyrius $CYRIUS_VERSION installed"

      - name: Syntax check
        run: |
          for f in src/*.cyr; do
            echo "  check: $f"
            cyrius check "$f"
          done

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/shravan
          echo "shravan: $(wc -c < build/shravan) bytes"

      - name: Verify ELF
        run: |
          file build/shravan | grep -q "ELF 64-bit" || { echo "Not a valid ELF binary"; exit 1; }

      - name: Test suite
        run: |
          ./build/shravan 2>&1 | tee /tmp/test-output.txt
          grep -q "0 failed" /tmp/test-output.txt || { echo "Tests failed"; exit 1; }

      - name: Lint
        run: |
          for f in src/*.cyr; do
            echo "  lint: $f"
            cyrius lint "$f" || true
          done

      - name: Build benchmarks
        run: |
          cyrius build src/bench.cyr build/bench
          echo "bench: $(wc -c < build/bench) bytes"

      - name: Run benchmarks
        run: ./build/bench

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          MISSING=0
          for doc in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.toml CLAUDE.md; do
            if [ -f "$doc" ]; then echo "  OK: $doc"; else echo "  MISSING: $doc"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TOML_VERSION=$(grep '^version = ' cyrius.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          [ "$FILE_VERSION" = "$TOML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.toml ($TOML_VERSION)"; exit 1; }
          grep -q "\\[$FILE_VERSION\\]" CHANGELOG.md || { echo "Version $FILE_VERSION not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $FILE_VERSION"
